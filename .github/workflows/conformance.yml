name: Conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    # 22.04 still offers Python 3.9, the oldest version the collector supports.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      # The GitHub Ubuntu image ships pwsh, so the PowerShell edition is checked here, not skipped.
      - name: Every edition produces the expected payload from the fixtures
        run: scripts/conformance.sh
